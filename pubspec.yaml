name: fui_kit
description: >-
  Flat UI icon pack for Flutter: 2,988 SVG icons (498 icons in 6 styles —
  regular, bold and solid, rounded or straight) based on Flaticon UIcons.
  Themeable and accessible.
version: 2.1.0
homepage: https://baldomerocho.github.io/fui_kit/
repository: https://github.com/baldomerocho/fui_kit
issue_tracker: https://github.com/baldomerocho/fui_kit/issues

topics:
  - icons
  - svg
  - ui
  - icon-pack
  - flat-icons

screenshots:
  - description: Gallery of fui_kit flat SVG icons in the 6 available styles.
    path: doc/images/showcase.webp

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/bold/rounded/svg/
    - assets/icons/bold/straight/svg/
    - assets/icons/regular/rounded/svg/
    - assets/icons/regular/straight/svg/
    - assets/icons/solid/rounded/svg/
    - assets/icons/solid/straight/svg/
