name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Verify generated icon maps are up to date
        run: |
          dart run tool/generate_icons.dart
          dart format lib/src/styles
          git diff --exit-code -I '^// Generated on ' lib/src/styles

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Run example tests
        working-directory: example
        run: |
          flutter pub get
          flutter test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: baldomerocho/fui_kit

  pana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pana needs the webp CLI tools to validate pubspec screenshots.
      - name: Install webp tools
        run: sudo apt-get update -q && sudo apt-get install -yq webp

      - name: Install pana
        run: dart pub global activate pana

      - name: Verify pub points (no point may be lost)
        run: dart pub global run pana --no-warning --exit-code-threshold 0 .
